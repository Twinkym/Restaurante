<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David De La Puente Enriquez - KirgoDev">
    <link rel="icon" th:href="@{/img/logos/logotipo_restaurante.ico}" type="image/x-icon">
    <title th:text="${titulo}">Dashboard</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- -->
    <!-- Ruta Archivos Estáticos -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <!-- Insertar Cabecera  -->
    <div th:replace="~{fragments/header :: header(tituloCabecera=${tituloCabecera})}">DASHBOARD</div>

    <main class="container mt-4">
        <section id="personalData" class="mb-4">
           <h2>Bienvenido, <span th:text="${usuario}">Cliente</span></h2>
            <p>Correo electronico: <span th:text="${datos.email}" >email@ejemplo.com</span></p>
           <p>Total de reservas: <span th:text="${datos.totalReservas}">0</span> </p>
        </section>

        <section id="hReservas">
            <h2>Historial de reservas del cliente</h2>
            <p>Listado de sus reservas de usuario...</p>

        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}">
        <!-- Contenido del Footer -->
    </div>

    <script crossorigin="anonymous" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script crossorigin="anonymous" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"></script>
</body>
</html>
